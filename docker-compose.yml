services:
  postgres:
    image: postgres:15
    container_name: de_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: de_db
    ports:
      - "5432:5432"
    volumes:
      - app_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_user -d de_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.50.17
    container_name: de_metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase.db/metabase.db
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
    volumes:
      - metabase_data:/metabase.db

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  bucket-init:
    image: minio/mc:latest
    container_name: bucket-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./orders.csv:/seed/orders.csv:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb -p local/lakehouse/raw || true &&
      mc mb -p local/lakehouse/bronze || true &&
      mc mb -p local/lakehouse/silver || true &&
      mc mb -p local/lakehouse/gold || true &&
      mc cp /seed/orders.csv local/lakehouse/raw/ecommerce/orders.csv || true &&
      exit 0
      "
    restart: "no"

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      IS_RESUME: "true"
    depends_on:
      minio:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    volumes:
      - ./hive/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro

  trino:
    image: trinodb/trino:480
    container_name: trino
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "8181:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

  spark:
    image: apache/spark:3.5.1
    container_name: spark
    restart: unless-stopped
    command: ["/bin/bash", "-lc", "sleep infinity"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./my_submissions:/opt/spark/work-dir/my_submissions
      - ./orders.csv:/opt/spark/work-dir/orders.csv:ro
    ports:
      - "4040:4040"

volumes:
  app_pg_data:
  metabase_data:
  minio_data:
